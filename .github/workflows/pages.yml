name: Web app (GitHub Pages)

# Builds the installable web version (Rust core as WebAssembly) and publishes it to
# https://<owner>.github.io/PA/
on:
  push:
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:
  # Refresh the news twice a day, at about 05:45 and 16:45 Sydney time all year round (the feeds can't be read from
  # the browser, so news.json is built here and published with the site). GitHub crons are in UTC and Sydney moves
  # between UTC+11 (summer) and UTC+10 (winter), so both sets of times are listed and the "gate" job below lets
  # through only the runs that land in the right Sydney window.
  # Scheduled runs only ever run on the default branch (main), so the deploy condition below passes for them.
  schedule:
    - cron: "45 18 * * *" # 05:45 Sydney in summer
    - cron: "45 19 * * *" # 05:45 Sydney in winter
    - cron: "45 5 * * *" # 16:45 Sydney in summer
    - cron: "45 6 * * *" # 16:45 Sydney in winter

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Pushes and manual runs always go ahead. A scheduled run goes ahead only inside the Sydney news windows
  # (05:30-06:29 and 16:30-17:29), so each window gets one run whatever the season.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        run: |
          run=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            m=$(( 10#$(TZ=Australia/Sydney date +%H) * 60 + 10#$(TZ=Australia/Sydney date +%M) ))
            if { [ $m -ge 330 ] && [ $m -lt 390 ]; } || { [ $m -ge 990 ] && [ $m -lt 1050 ]; }; then run=true; else run=false; fi
            echo "Sydney minute of day: $m -> run=$run"
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Restore wasm-pack
        id: wasmpack
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-pack
          key: wasm-pack-0.15.0-${{ runner.os }}
      - name: Install wasm-pack
        if: steps.wasmpack.outputs.cache-hit != 'true'
        run: cargo install wasm-pack --locked --version 0.15.0
      - name: Core tests (nothing is published if these fail)
        run: cargo test -p pa-core
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: News script tests
        run: node --test scripts/news/fetch-news.test.mjs
      - name: Fetch news (free RSS feeds; a failing feed is skipped, and the build goes on without news if all fail)
        continue-on-error: true
        run: node scripts/news/fetch-news.mjs --out app/public/news.json
      - name: Make sure news.json exists
        run: |
          mkdir -p app/public
          test -s app/public/news.json || echo "{\"generated_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"items\":[]}" > app/public/news.json
      - name: Build
        working-directory: app
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          npm ci
          npm run build:web
      - name: Whole-app tests on a phone-sized screen (nothing is published if these fail; skipped for the news refresh)
        if: github.event_name != 'schedule'
        working-directory: app
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium
          node e2e/run.cjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    # push, manual and scheduled runs on main deploy (scheduled runs always run on the default branch)
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
